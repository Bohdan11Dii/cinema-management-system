{% extends "base.html" %}

{% block content %}
  {% if messages %}
    {% for message in messages %}
      <div class="alert alert-success">{{ message }}</div>
    {% endfor %}
  {% endif %}
  <div class="table-container">
    <h1>Background Banner</h1>
    <div class="add-btn-container">
      <a href="{% url 'admin_panel:back-create' %}" class="btn-add">Add</a>
    </div>

    <table class="table table-striped">
      <thead>
      <tr>
        <th scope="col">Type</th>
        <th scope="col">Action</th>
      </tr>
      </thead>
      <tbody>
      {% for back in back_list %}
        <tr>
          <th scope="row">{{ back.type }}</th>
          <td>
            <a href="{% url 'admin_panel:back-update' back.id %}" class="btn btn-outline-warning">Редагувати</a>
            <a href="{% url 'admin_panel:back-delete' back.id %}" class="btn btn-outline-danger">Видалити</a>
          </td>
        </tr>
      {% empty %}

        <tr>
          <td colspan="5">No background banner</td>
        </tr>
      {% endfor %}
      </tbody>
    </table>
  </div>
{% endblock %}
